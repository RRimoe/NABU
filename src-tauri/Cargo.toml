[package]
name = "nabu"
version = "0.1.0"
description = "An AI-native image editor built around intent, not tools."
authors = ["Nabu contributors"]
edition = "2021"

[lib]
name = "nabu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# The language router is optional: it pulls in a second inference engine, and a
# contributor fixing a button should not have to compile it.
llm = ["dep:mistralrs"]

# Inference is arithmetic in tight loops, and an unoptimised build runs it tens
# of times slower — slowly enough that loading the language model during
# `tauri dev` looks like the application has hung.
#
# Dependencies are compiled fully optimised: they rarely change, so the cost is
# paid once. Nabu's own code sits at level 1, which is enough for the pixel
# loops in the image pipelines while keeping incremental rebuilds quick and the
# code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
tauri = { version = "2", features = [] }
# Pure-Rust LLM engine, used only for the intent router. Native tool calling
# means the model returns a structured call instead of prose to be parsed.
mistralrs = { version = "0.8.1", optional = true }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

# Scaricamento e verifica dei modelli AI.
# rustls invece di OpenSSL: evita di dipendere dalle librerie TLS di sistema
# e mantiene la build uniforme su Windows, macOS e Linux.
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"

# Motore di inferenza ONNX.
#   download-binaries : scarica ONNX Runtime per la piattaforma in fase di build
#   copy-dylibs       : copia le dylib accanto all'eseguibile (necessario a Tauri)
#   tls-rustls        : il build script scarica via rustls, non via OpenSSL,
#                       così la build non dipende dalle librerie TLS di sistema
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "copy-dylibs",
    "api-27",
    "tls-rustls",
] }

# Accelerazione GPU: ogni piattaforma abilita il provider che le è nativo.
# Il fallback su CPU resta sempre attivo se il provider non è disponibile.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
