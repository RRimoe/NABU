name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Interface (typecheck, translations, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:locales
      - run: npm run check:commands
      - run: npx vite build

  engine:
    name: Engine (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/nabu-stitch
            crates/nabu-retouch
            crates/nabu-cli
      # Tauri embeds the built interface, so the folder it points at must exist.
      - run: mkdir -p dist
      # Tests that need downloaded models or the network are #[ignore]d and
      # stay out of CI; everything else runs.
      - run: cargo test --all-targets
        working-directory: src-tauri
      # The stitcher's own tests: precision against rendered ground truth.
      - run: cargo test --release
        working-directory: crates/nabu-stitch
      # Content-aware fill and healing (ported from PhotoCraft).
      - run: cargo test --release
        working-directory: crates/nabu-retouch
      # The command line, the MCP server and the bridge, against a fake editor.
      - run: cargo test
        working-directory: crates/nabu-cli
